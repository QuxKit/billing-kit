# Release — on a v* tag: build, test, and publish to npm, restricted.
#
# Nothing here creates the tag. Cutting a release is: bump the version in
# package.json, update CHANGELOG.md, merge, then `git tag vX.Y.Z && git push
# --tags`. NPM_TOKEN is a repository secret (an npm granular token with publish
# rights on @quxkit).
#
# GOING PUBLIC IS ONE CHANGE, NOT THREE. When @quxkit/billing-kit is ready to be
# public, all of these move together:
#
#   - `--access restricted` below becomes `--access public`
#   - `publishConfig.access` in package.json changes to match
#   - `--provenance` comes back, along with `id-token: write` under permissions
#   - QuxKit/billing-kit and QuxKit/quxkit-brand are made public on GitHub
#
# The last one is not optional for the third: npm generates provenance
# attestations only from a public repository, so `--provenance` fails outright
# while this repo is private. That is why it is absent rather than merely
# unused. The repository, homepage and bugs URLs in package.json, and the brand
# mark the README hotlinks out of quxkit-brand, are all 404 to anyone outside
# the org until that same step — which is survivable for a restricted package
# only its members can see, and is not survivable on a public listing page.
name: Release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # No `id-token: write`: it exists solely to let npm attach provenance, and
    # provenance is off while the repo is private. It returns with --provenance.
    permissions:
      contents: read

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: billing_kit_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      REQUIRE_DB: 1
      BILLING_KIT_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/billing_kit_test
      BILLING_KIT_CLI_TEST_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Verify
        run: pnpm lint && pnpm typecheck && pnpm build && pnpm test

      - name: Tag matches package version
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "tag $GITHUB_REF_NAME does not match package.json version ($expected)" >&2
            exit 1
          fi

      # Explicit, and matching package.json's publishConfig.access rather than
      # trusting it: the CLI flag wins over publishConfig, so the two disagreeing
      # is how a package meant to be private reaches the public registry.
      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: npm publish --access restricted
